<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Kelola Toko</title>
<style>
  :root{
    --paper:#FBF6EA; --ink:#20301F; --green:#25553F; --green-dark:#173D2B;
    --tomato:#C1442A; --mustard:#E2A430; --line:#20301F22;
  }
  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;margin:0;}
  .admin-wrap{max-width:560px;margin:0 auto;padding:24px 18px 60px;}
  h1{font-size:1.3rem;color:var(--green-dark);font-family:Georgia,serif;margin-bottom:6px;}
  h2{font-size:1.05rem;color:var(--green-dark);margin:30px 0 12px;border-bottom:2px solid var(--line);padding-bottom:6px;}
  label{display:block;font-size:.85rem;font-weight:600;color:var(--green-dark);margin:12px 0 6px;}
  input[type=text]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:.95rem;background:#fff;color:var(--ink);}
  input[type=file]{width:100%;padding:8px 0;font-size:.9rem;}
  input:focus{outline:2px solid var(--mustard);border-color:var(--green);}
  .btn-tambah{background:var(--green);color:#fff;border:none;border-radius:8px;padding:12px;width:100%;font-weight:700;font-size:.95rem;cursor:pointer;margin-top:10px;}
  .btn-tambah:disabled{opacity:.5;cursor:not-allowed;}
  .preview{width:80px;height:80px;object-fit:cover;border-radius:8px;margin-top:8px;border:1px solid var(--line);display:none;}

  .icon-row{display:flex;gap:8px;}
  .icon-row input{flex:1;}
  .icon-row input:first-child{flex:0 0 70px;text-align:center;font-size:1.2rem;}

  /* Kartu kategori (bisa dibuka-tutup) */
  .cat-card{background:#fff;border:1.5px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;}
  .cat-head{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;}
  .cat-head .icon-box{width:44px;height:44px;border-radius:8px;background:var(--mustard);
    display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
  .cat-head .info{flex:1;min-width:0;}
  .cat-head .count{display:block;font-size:.75rem;color:#6a7a68;margin-top:2px;}
  .cat-head .arrow{color:var(--green-dark);transition:transform .15s;}
  .cat-card.open .arrow{transform:rotate(180deg);}
  .btn-hapus-kat{background:var(--tomato);color:#fff;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:.8rem;}
  .cat-body{display:none;padding:4px 14px 16px;border-top:1px solid var(--line);}
  .cat-card.open .cat-body{display:block;}

  .f-cari{margin-top:18px;}
  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .row img{width:44px;height:44px;object-fit:cover;border-radius:6px;}
  .row .info{flex:1;min-width:0;}
  .row .info span{display:block;font-size:.82rem;color:#4a5a48;}
  .row button{border:none;border-radius:6px;padding:6px 10px;cursor:pointer;color:#fff;}
  .row .btn-edit{background:var(--green);}
  .row .btn-del{background:var(--tomato);}
  .kosong{color:#8a8a8a;font-size:.85rem;padding:10px 0;}
</style>
</head>
<body>
<div class="admin-wrap">
  <h1>Kelola Toko</h1>
  <a href="laporan.html" style="display:inline-block;margin-bottom:6px;font-size:.85rem;color:var(--green-dark);">📊 Lihat Laporan Penjualan</a>

  <h2>Tambah Kategori</h2>
  <div class="icon-row">
    <input type="text" id="iconKategori" placeholder="🥬" maxlength="4">
    <input type="text" id="namaKategori" placeholder="Contoh: Buah & Sayur">
  </div>
  <button class="btn-tambah" id="btnTambahKategori">Tambah Kategori</button>

  <h2>Kategori & Produk</h2>
  <p style="font-size:.82rem;color:#5a6a58;margin:0;">Klik kategori untuk membuka, lalu tambah atau edit produk di dalamnya.</p>
  <div id="daftarKategori">Memuat...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDaYRZsO7N6pQxudTHxpyBN_n_Sh4eXXV8",
    authDomain: "toko-online-312bb.firebaseapp.com",
    projectId: "toko-online-312bb",
    storageBucket: "toko-online-312bb.firebasestorage.app",
    messagingSenderId: "7924620978",
    appId: "1:7924620978:web:dd0e3a1a94102aa7ecb3ab"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const produkRef = collection(db, "produk");
  const kategoriRef = collection(db, "kategori");

  let kategoriList = [];     // [{id, nama, icon}]
  let semuaProduk = {};      // id -> data produk
  const terbuka = new Set(); // kategori yang sedang terbuka
  const sedangEdit = {};     // id kategori -> id produk yang sedang diedit

  // ---------- UTILITAS ----------
  function esc(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function fmt(n){
    return "Rp " + Number(n).toLocaleString("id-ID", {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function formatInputHarga(el){
    el.addEventListener("input", ()=>{
      let value = el.value.replace(/[^0-9,]/g, "");
      const parts = value.split(",");
      let integer = parts[0].replace(/\./g, "").replace(/^0+(?=\d)/, "");
      integer = integer.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      let decimal = parts.length > 1 ? parts[1].slice(0, 2) : undefined;
      el.value = decimal !== undefined ? integer + "," + decimal : integer;
    });
  }

  function parseHarga(str){
    const bersih = str.replace(/\./g, "").replace(",", ".");
    return parseFloat(bersih) || 0;
  }

  function slugify(str){
    return str.toLowerCase().trim()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "")
      .substring(0, 24);
  }

  function resizeImage(file, maxSize = 300, quality = 0.7){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > maxSize || h > maxSize){
            const ratio = Math.min(maxSize / w, maxSize / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---------- MUAT DATA ----------
  async function muatKategori(){
    const snap = await getDocs(kategoriRef);
    kategoriList = [];
    snap.forEach(d => kategoriList.push({ id: d.id, ...d.data() }));
  }

  async function muatProduk(){
    const snap = await getDocs(produkRef);
    semuaProduk = {};
    snap.forEach(d => { semuaProduk[d.id] = d.data(); });
  }

  // ---------- DAFTAR PRODUK DI DALAM KATEGORI ----------
  function renderList(card, catId){
    const el = card.querySelector(".list-produk");
    const kata = card.querySelector(".f-cari").value.trim().toLowerCase();
    const items = Object.entries(semuaProduk).filter(([id, d]) => d.kategori === catId);
    card.querySelector(".count").textContent = items.length + " produk";

    const tampil = (kata ? items.filter(([id, d]) => (d.nama || "").toLowerCase().includes(kata)) : items)
      .sort((a, b) => (a[1].nama || "").localeCompare(b[1].nama || ""));

    el.innerHTML = "";
    if(items.length === 0){
      el.innerHTML = `<p class="kosong">Belum ada produk di kategori ini.</p>`;
      return;
    }
    if(tampil.length === 0){
      el.innerHTML = `<p class="kosong">Produk tidak ditemukan.</p>`;
      return;
    }

    tampil.forEach(([id, d])=>{
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <img src="${d.gambar || ''}" onerror="this.style.visibility='hidden'">
        <div class="info"><b>${esc(d.nama)}</b><span>${fmt(d.harga)}</span></div>
        <button class="btn-edit" data-edit="${id}">Edit</button>
        <button class="btn-del" data-del="${id}">Hapus</button>`;
      el.appendChild(row);
    });

    el.querySelectorAll("[data-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=> mulaiEdit(card, catId, btn.dataset.edit));
    });
    el.querySelectorAll("[data-del]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(!confirm("Hapus produk ini?")) return;
        await deleteDoc(doc(db, "produk", btn.dataset.del));
        delete semuaProduk[btn.dataset.del];
        if(sedangEdit[catId] === btn.dataset.del) resetForm(card, catId);
        renderList(card, catId);
      });
    });
  }

  // ---------- FORM PRODUK (per kategori) ----------
  function resetForm(card, catId){
    delete sedangEdit[catId];
    card.querySelector(".f-nama").value = "";
    card.querySelector(".f-harga").value = "";
    card.querySelector(".f-gambar").value = "";
    card.querySelector(".f-preview").style.display = "none";
    card.querySelector(".f-simpan").textContent = "Tambah Produk";
    card.querySelector(".f-batal").style.display = "none";
  }

  function mulaiEdit(card, catId, id){
    const d = semuaProduk[id];
    if(!d) return;
    sedangEdit[catId] = id;
    card.querySelector(".f-nama").value = d.nama || "";
    card.querySelector(".f-harga").value = Number(d.harga).toLocaleString("id-ID", {minimumFractionDigits:2, maximumFractionDigits:2});
    card.querySelector(".f-gambar").value = "";
    const pv = card.querySelector(".f-preview");
    pv.src = d.gambar || "";
    pv.style.display = d.gambar ? "block" : "none";
    card.querySelector(".f-simpan").textContent = "Simpan Perubahan";
    card.querySelector(".f-batal").style.display = "block";
    card.querySelector(".form-mini").scrollIntoView({ behavior: "smooth", block: "center" });
  }

  // ---------- DAFTAR KATEGORI ----------
  function renderKategori(){
    const wadah = document.getElementById("daftarKategori");
    wadah.innerHTML = "";

    if(kategoriList.length === 0){
      wadah.innerHTML = `<p class="kosong">Belum ada kategori. Tambahkan dulu di atas.</p>`;
      return;
    }

    kategoriList.forEach(k=>{
      const card = document.createElement("div");
      card.className = "cat-card" + (terbuka.has(k.id) ? " open" : "");
      card.innerHTML = `
        <div class="cat-head">
          <div class="icon-box">${esc(k.icon || "🛒")}</div>
          <div class="info"><b>${esc(k.nama)}</b><span class="count"></span></div>
          <button class="btn-hapus-kat" type="button">Hapus</button>
          <span class="arrow">▾</span>
        </div>
        <div class="cat-body">
          <div class="form-mini">
            <label>Nama produk</label>
            <input type="text" class="f-nama" placeholder="Contoh: Beras 5kg">
            <label>Harga (Rp)</label>
            <input type="text" class="f-harga" inputmode="decimal" placeholder="Contoh: 57.302,29">
            <label>Foto produk (JPG/PNG)</label>
            <input type="file" class="f-gambar" accept="image/*">
            <img class="preview f-preview">
            <button class="btn-tambah f-simpan" type="button">Tambah Produk</button>
            <button class="btn-tambah f-batal" type="button" style="display:none;background:#8a8a8a;">Batal Edit</button>
          </div>
          <input type="text" class="f-cari" placeholder="Cari produk di kategori ini...">
          <div class="list-produk"></div>
        </div>`;
      wadah.appendChild(card);

      const head = card.querySelector(".cat-head");
      const fHarga = card.querySelector(".f-harga");
      const fGambar = card.querySelector(".f-gambar");
      const fPreview = card.querySelector(".f-preview");
      const btnSimpan = card.querySelector(".f-simpan");

      formatInputHarga(fHarga);

      // Buka / tutup kategori
      head.addEventListener("click", (e)=>{
        if(e.target.closest(".btn-hapus-kat")) return;
        card.classList.toggle("open");
        if(card.classList.contains("open")) terbuka.add(k.id); else terbuka.delete(k.id);
      });

      // Hapus kategori
      card.querySelector(".btn-hapus-kat").addEventListener("click", async ()=>{
        const jumlah = Object.values(semuaProduk).filter(d => d.kategori === k.id).length;
        const pesan = jumlah > 0
          ? `Hapus kategori "${k.nama}"? Ada ${jumlah} produk di dalamnya. Produk TIDAK ikut terhapus, tapi tidak akan terlihat di halaman toko.`
          : `Hapus kategori "${k.nama}"?`;
        if(!confirm(pesan)) return;
        await deleteDoc(doc(db, "kategori", k.id));
        terbuka.delete(k.id);
        await muatKategori();
        renderKategori();
      });

      // Preview foto
      fGambar.addEventListener("change", async (e)=>{
        const file = e.target.files[0];
        if(!file){ fPreview.style.display = "none"; return; }
        fPreview.src = await resizeImage(file);
        fPreview.style.display = "block";
      });

      // Cari produk
      card.querySelector(".f-cari").addEventListener("input", ()=> renderList(card, k.id));

      // Batal edit
      card.querySelector(".f-batal").addEventListener("click", ()=> resetForm(card, k.id));

      // Simpan (tambah baru / simpan perubahan)
      btnSimpan.addEventListener("click", async ()=>{
        const nama = card.querySelector(".f-nama").value.trim();
        const harga = parseHarga(fHarga.value.trim());
        const file = fGambar.files[0];

        if(!nama || !harga || harga <= 0){
          alert("Nama dan harga wajib diisi.");
          return;
        }

        const editId = sedangEdit[k.id];
        btnSimpan.disabled = true;
        btnSimpan.textContent = "Menyimpan...";

        try{
          if(editId){
            let gambar = (semuaProduk[editId] || {}).gambar || "";
            if(file) gambar = await resizeImage(file);
            await updateDoc(doc(db, "produk", editId), { nama, harga, kategori: k.id, gambar });
          }else{
            const gambar = file ? await resizeImage(file) : "";
            await addDoc(produkRef, { nama, harga, kategori: k.id, gambar });
          }
          await muatProduk();
          resetForm(card, k.id);
          renderList(card, k.id);
          if(!editId) card.querySelector(".f-nama").focus(); // siap input produk berikutnya
        }catch(err){
          console.error(err);
          alert("Gagal menyimpan. Coba lagi.");
          btnSimpan.textContent = editId ? "Simpan Perubahan" : "Tambah Produk";
        }finally{
          btnSimpan.disabled = false;
        }
      });

      renderList(card, k.id);
    });
  }

  // ---------- TAMBAH KATEGORI ----------
  document.getElementById("btnTambahKategori").addEventListener("click", async ()=>{
    const nama = document.getElementById("namaKategori").value.trim();
    const icon = document.getElementById("iconKategori").value.trim() || "🛒";
    const kode = slugify(nama);

    if(!nama || !kode){
      alert("Nama kategori wajib diisi.");
      return;
    }

    await setDoc(doc(db, "kategori", kode), { nama, icon });
    document.getElementById("namaKategori").value = "";
    document.getElementById("iconKategori").value = "";

    terbuka.add(kode); // langsung terbuka supaya bisa mulai isi produk
    await muatKategori();
    renderKategori();
  });

  // ---------- MULAI ----------
  (async ()=>{
    await Promise.all([muatKategori(), muatProduk()]);
    renderKategori();
  })();
</script>
</body>
</html>
