<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Kelola Produk</title>
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap{max-width:520px;margin:0 auto;padding:24px 18px 60px;}
  .admin-wrap h1{font-size:1.3rem;color:var(--green-dark);}
  .produk-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .produk-row img{width:44px;height:44px;object-fit:cover;border-radius:6px;}
  .produk-row .info{flex:1;}
  .produk-row button{background:var(--tomato);color:#fff;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;}
  select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-size:.95rem;background:#fff;}
  input[type=file]{width:100%;padding:8px 0;font-size:.9rem;}
  .btn-tambah{background:var(--green);color:#fff;border:none;border-radius:8px;padding:12px;width:100%;font-weight:700;font-size:.95rem;cursor:pointer;margin-top:10px;}
  .btn-tambah:disabled{opacity:.5;cursor:not-allowed;}
  .preview{width:80px;height:80px;object-fit:cover;border-radius:8px;margin-top:8px;border:1px solid var(--line);display:none;}
</style>
</head>
<body>
<div class="admin-wrap">
  <h1>Kelola Produk</h1>

  <label for="nama">Nama produk</label>
  <input type="text" id="nama" placeholder="Contoh: Beras 5kg">

  <label for="harga">Harga (Rp)</label>
  <input type="text" id="harga" placeholder="Contoh: 65000">

  <label for="kategori">Kategori</label>
  <select id="kategori">
    <option value="sembako">Sembako</option>
    <option value="minuman">Minuman</option>
    <option value="snack">Snack</option>
    <option value="rumah">Kebutuhan Rumah</option>
  </select>

  <label for="gambar">Foto produk (JPG/PNG)</label>
  <input type="file" id="gambar" accept="image/*">
  <img id="preview" class="preview">

  <button class="btn-tambah" id="btnTambah">Tambah Produk</button>

  <h2 style="margin-top:30px;">Daftar Produk</h2>
  <div id="daftarProduk"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDaYRZsO7N6pQxudTHxpyBN_n_Sh4eXXV8",
    authDomain: "toko-online-312bb.firebaseapp.com",
    projectId: "toko-online-312bb",
    storageBucket: "toko-online-312bb.firebasestorage.app",
    messagingSenderId: "7924620978",
    appId: "1:7924620978:web:dd0e3a1a94102aa7ecb3ab"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const produkRef = collection(db, "produk");

  function fmt(n){ return "Rp " + Number(n).toLocaleString("id-ID"); }

  function resizeImage(file, maxSize = 300, quality = 0.7){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > maxSize || h > maxSize){
            const ratio = Math.min(maxSize / w, maxSize / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById("gambar").addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    const preview = document.getElementById("preview");
    if(!file){ preview.style.display = "none"; return; }
    const dataUrl = await resizeImage(file);
    preview.src = dataUrl;
    preview.style.display = "block";
  });

  async function tampilkanDaftar(){
    const el = document.getElementById("daftarProduk");
    el.innerHTML = "Memuat...";
    const snapshot = await getDocs(produkRef);
    el.innerHTML = "";
    if(snapshot.empty){
      el.innerHTML = "<p>Belum ada produk.</p>";
      return;
    }
    snapshot.forEach(docSnap=>{
      const data = docSnap.data();
      const row = document.createElement("div");
      row.className = "produk-row";
      row.innerHTML = `
        <img src="${data.gambar || ''}" onerror="this.style.visibility='hidden'">
        <div class="info">
          <div><b>${data.nama}</b></div>
          <div>${fmt(data.harga)} — ${data.kategori}</div>
        </div>
        <button data-id="${docSnap.id}">Hapus</button>`;
      el.appendChild(row);
    });
    el.querySelectorAll("button[data-id]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(confirm("Hapus produk ini?")){
          await deleteDoc(doc(db, "produk", btn.dataset.id));
          tampilkanDaftar();
        }
      });
    });
  }

  document.getElementById("btnTambah").addEventListener("click", async ()=>{
    const btn = document.getElementById("btnTambah");
    const nama = document.getElementById("nama").value.trim();
    const harga = document.getElementById("harga").value.trim();
    const kategori = document.getElementById("kategori").value;
    const fileInput = document.getElementById("gambar");
    const file = fileInput.files[0];

    if(!nama || !harga){
      alert("Nama dan harga wajib diisi.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Menyimpan...";

    let gambar = "";
    if(file){
      gambar = await resizeImage(file);
    }

    await addDoc(produkRef, { nama, harga: Number(harga), kategori, gambar });

    document.getElementById("nama").value = "";
    document.getElementById("harga").value = "";
    fileInput.value = "";
    document.getElementById("preview").style.display = "none";
    btn.disabled = false;
    btn.textContent = "Tambah Produk";

    tampilkanDaftar();
  });

  tampilkanDaftar();
</script>
</body>
</html>
