<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kategori — Swalayan Masithah</title>
<style>
  :root{
    --paper:#FBF6EA; --ink:#20301F; --green:#25553F; --green-dark:#173D2B;
    --tomato:#C1442A; --mustard:#E2A430; --line:#20301F22;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  h1,h2,.brand{font-family:'Georgia','Times New Roman',serif;}

  header{background:var(--green);color:var(--paper);padding:18px 20px 22px;
    position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;
    background:repeating-linear-gradient(90deg,var(--mustard) 0 28px,var(--tomato) 28px 56px);}
  .back{color:var(--paper);text-decoration:none;font-size:.85rem;opacity:.85;}
  .brand{font-size:1.4rem;margin:6px 0 0;letter-spacing:.3px;}

  main{max-width:640px;margin:0 auto;padding:24px 18px 140px;}
  section h2{font-size:1.05rem;margin:0 0 12px;color:var(--green-dark);
    border-bottom:2px solid var(--line);padding-bottom:8px;}

  input[type=text]{width:100%;padding:10px 12px;border:1.5px solid var(--line);
    border-radius:8px;font-size:.95rem;font-family:inherit;background:#fff;color:var(--ink);
    margin-bottom:14px;}
  input:focus{outline:2px solid var(--mustard);border-color:var(--green);}

  .item{display:flex;align-items:center;gap:12px;padding:12px 4px;
    border-bottom:1px solid var(--line);}
  .item .info{flex:1;min-width:0;}
  .item .name{font-weight:600;font-size:.97rem;}
  .item .price{color:#4a5a48;font-size:.85rem;margin-top:2px;}
  .thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;
    border:1px solid var(--line);flex-shrink:0;background:#fff;}
  .stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--green);
    border-radius:8px;overflow:hidden;flex-shrink:0;}
  .stepper button{background:var(--paper);border:none;width:32px;height:32px;
    font-size:1.1rem;color:var(--green-dark);cursor:pointer;}
  .stepper button:active{background:var(--mustard);}
  .stepper .qty{width:28px;text-align:center;font-weight:600;font-size:.9rem;}

  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--green-dark);color:var(--paper);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
    display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .bar .total{line-height:1.2;}
  .bar .total b{font-size:1.05rem;display:block;}
  .bar .total span{font-size:.75rem;opacity:.8;}
  .bar a.btn{background:var(--tomato);color:#fff;border:none;border-radius:8px;
    padding:12px 18px;font-size:.95rem;font-weight:700;cursor:pointer;white-space:nowrap;
    text-decoration:none;}
  .bar a.btn.disabled{opacity:.45;pointer-events:none;}

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#F2EEE1; }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">← Kembali ke kategori</a>
  <p class="brand" id="judulKategori">Memuat...</p>
</header>

<main>
  <section>
    <h2 id="judulProduk">Produk</h2>
    <input type="text" id="cariProduk" placeholder="Cari produk...">
    <div id="daftarProduk">Memuat produk...</div>
  </section>
</main>

<div class="bar">
  <div class="total">
    <b id="totalHarga">Rp 0</b>
    <span id="totalItem">0 barang di keranjang</span>
  </div>
  <a class="btn" id="btnKeranjang" href="keranjang.html">Lihat Keranjang</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDaYRZsO7N6pQxudTHxpyBN_n_Sh4eXXV8",
    authDomain: "toko-online-312bb.firebaseapp.com",
    projectId: "toko-online-312bb",
    storageBucket: "toko-online-312bb.firebasestorage.app",
    messagingSenderId: "7924620978",
    appId: "1:7924620978:web:dd0e3a1a94102aa7ecb3ab"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const params = new URLSearchParams(window.location.search);
  const kat = params.get("kategori") || "";

  let produk = [];

  function fmt(n){
    return "Rp " + Number(n).toLocaleString("id-ID", {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  // ---------- KERANJANG (disimpan di localStorage, berlaku lintas kategori) ----------
  function getCart(){
    try{ return JSON.parse(localStorage.getItem("keranjang") || "{}"); }catch(e){ return {}; }
  }
  function saveCart(cart){
    localStorage.setItem("keranjang", JSON.stringify(cart));
  }
  function cartCount(cart){
    return Object.values(cart).reduce((s,it)=>s+it.qty,0);
  }
  function cartTotal(cart){
    return Object.values(cart).reduce((s,it)=>s+it.p*it.qty,0);
  }
  function updateBar(){
    const cart = getCart();
    const count = cartCount(cart);
    document.getElementById("totalHarga").textContent = fmt(cartTotal(cart));
    document.getElementById("totalItem").textContent = count + " barang di keranjang";
    document.getElementById("btnKeranjang").classList.toggle("disabled", count === 0);
  }

  async function loadJudulKategori(){
    try{
      const snap = await getDoc(doc(db, "kategori", kat));
      const nama = snap.exists() ? snap.data().nama : kat;
      document.getElementById("judulKategori").textContent = nama;
      document.getElementById("judulProduk").textContent = "Produk " + nama;
    }catch(e){
      document.getElementById("judulKategori").textContent = kat;
    }
  }

  async function loadProduk(){
    const el = document.getElementById("daftarProduk");
    el.innerHTML = "Memuat produk...";
    const q = query(collection(db, "produk"), where("kategori", "==", kat));
    const snapshot = await getDocs(q);
    produk = [];
    snapshot.forEach(docSnap=>{
      const data = docSnap.data();
      produk.push({ id: docSnap.id, n: data.nama, p: Number(data.harga), img: data.gambar, kategori: kat });
    });
    render();
  }

  function render(){
    const el = document.getElementById("daftarProduk");
    el.innerHTML = "";
    const cart = getCart();
    const kataKunci = document.getElementById("cariProduk").value.trim().toLowerCase();
    const produkTampil = kataKunci
      ? produk.filter(item => item.n.toLowerCase().includes(kataKunci))
      : produk;

    if(produk.length === 0){
      el.innerHTML = `<p style="color:#8a8a8a;font-size:.9rem;padding:8px 4px;">Belum ada produk di kategori ini.</p>`;
      return;
    }
    if(produkTampil.length === 0){
      el.innerHTML = `<p style="color:#8a8a8a;font-size:.9rem;padding:8px 4px;">Produk "${kataKunci}" tidak ditemukan.</p>`;
      return;
    }
    produkTampil.forEach((item)=>{
      const qtySekarang = cart[item.id] ? cart[item.id].qty : 0;
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `
        <img class="thumb" src="${item.img || ''}" alt="${item.n}" onerror="this.style.visibility='hidden'">
        <div class="info">
          <div class="name">${item.n}</div>
          <div class="price">${fmt(item.p)}</div>
        </div>
        <div class="stepper">
          <button data-id="${item.id}" data-d="-1" aria-label="Kurangi">−</button>
          <span class="qty" id="q-${item.id}">${qtySekarang}</span>
          <button data-id="${item.id}" data-d="1" aria-label="Tambah">+</button>
        </div>`;
      el.appendChild(row);
    });
    document.querySelectorAll(".stepper button").forEach(b=>{
      b.addEventListener("click", ()=>{
        const id = b.dataset.id;
        const d = parseInt(b.dataset.d);
        const item = produk.find(p => p.id === id);
        const cart = getCart();
        const qtyBaru = Math.max(0, (cart[id] ? cart[id].qty : 0) + d);

        if(qtyBaru === 0){
          delete cart[id];
        }else{
          cart[id] = { n: item.n, p: item.p, img: item.img, kategori: item.kategori, qty: qtyBaru };
        }
        saveCart(cart);
        document.getElementById("q-"+id).textContent = qtyBaru;
        updateBar();
      });
    });
  }

  document.getElementById("cariProduk").addEventListener("input", render);

  loadJudulKategori();
  loadProduk();
  updateBar();
</script>
</body>
</html>
