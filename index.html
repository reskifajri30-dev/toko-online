<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swalayan Masithah — Pesan Antar</title>
<style>
  :root{
    --paper:#FBF6EA; --ink:#20301F; --green:#25553F; --green-dark:#173D2B;
    --tomato:#C1442A; --mustard:#E2A430; --line:#20301F22;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  h1,.brand{font-family:'Georgia','Times New Roman',serif;}

  header{background:var(--green);color:var(--paper);padding:22px 20px 26px;
    position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;
    background:repeating-linear-gradient(90deg,var(--mustard) 0 28px,var(--tomato) 28px 56px);}
  .brand{font-size:1.6rem;margin:0 0 4px;letter-spacing:.3px;}
  .logo-wrap{display:inline-block;background:#225e0600;padding:10px 20px;
  border-radius:14px;margin-bottom:8px;max-width:100%;}
.logo{width:380px;height:150px;display:block;max-width:100%;}
  header p{margin:0;opacity:.85;max-width:46ch;line-height:1.5;font-size:.95rem;}

  main{max-width:640px;margin:0 auto;padding:28px 18px 60px;}
  main h2{font-size:1rem;color:var(--green-dark);margin:0 0 16px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .cat-card{display:block;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:20px 14px;text-decoration:none;color:var(--ink);text-align:center;
    transition:transform .1s;}
  .cat-card:active{transform:scale(.97);background:var(--paper);}
  .cat-card .icon{width:44px;height:44px;margin:0 auto 10px;border-radius:12px;
    background:var(--mustard);display:flex;align-items:center;justify-content:center;
    font-size:1.4rem;}
  .cat-card .name{font-weight:700;font-size:.95rem;color:var(--green-dark);}

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#F2EEE1; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <img src="images/logo-06.png" alt="Swalayan Masithah" class="logo">
  </div>
  <p>Pilih kategori untuk lihat produk dan pesan langsung lewat WhatsApp.</p>
</header>

<main>
  <h2>Kategori Produk</h2>
  <div class="grid" id="daftarKategori">Memuat kategori...</div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDaYRZsO7N6pQxudTHxpyBN_n_Sh4eXXV8",
    authDomain: "toko-online-312bb.firebaseapp.com",
    projectId: "toko-online-312bb",
    storageBucket: "toko-online-312bb.firebasestorage.app",
    messagingSenderId: "7924620978",
    appId: "1:7924620978:web:dd0e3a1a94102aa7ecb3ab"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadKategori(){
    const el = document.getElementById("daftarKategori");
    const snapshot = await getDocs(collection(db, "kategori"));
    el.innerHTML = "";
    if(snapshot.empty){
      el.innerHTML = `<p style="grid-column:1/-1;color:#8a8a8a;">Belum ada kategori. Tambahkan lewat halaman admin.</p>`;
      return;
    }
    snapshot.forEach(docSnap=>{
      const data = docSnap.data();
      const a = document.createElement("a");
      a.className = "cat-card";
      a.href = "kategori.html?kategori=" + docSnap.id;
      a.innerHTML = `
        <div class="icon">${data.icon || "🛒"}</div>
        <div class="name">${data.nama}</div>`;
      el.appendChild(a);
    });
  }

  loadKategori();
</script>
</body>
</html>
