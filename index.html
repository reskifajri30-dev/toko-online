<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swalayan Masithah — Pesan Antar</title>
<style>
  :root{
    --paper:#FBF6EA;
    --ink:#20301F;
    --green:#25553F;
    --green-dark:#173D2B;
    --tomato:#C1442A;
    --mustard:#E2A430;
    --line:#20301F22;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  h1,.brand{font-family:'Georgia','Times New Roman',serif;}

  header{background:var(--green);color:var(--paper);padding:22px 20px 26px;
    position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;
    background:repeating-linear-gradient(90deg,var(--mustard) 0 28px,var(--tomato) 28px 56px);}
  .brand{font-size:1.6rem;margin:0 0 4px;letter-spacing:.3px;}
  header p{margin:0;opacity:.85;max-width:46ch;line-height:1.5;font-size:.95rem;}

  main{max-width:640px;margin:0 auto;padding:28px 18px 60px;}
  main h2{font-size:1rem;color:var(--green-dark);margin:0 0 16px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .cat-card{display:block;background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:20px 14px;text-decoration:none;color:var(--ink);text-align:center;
    transition:transform .1s;}
  .cat-card:active{transform:scale(.97);background:var(--paper);}
  .cat-card .icon{width:44px;height:44px;margin:0 auto 10px;border-radius:12px;
    background:var(--mustard);display:flex;align-items:center;justify-content:center;
    font-size:1.4rem;}
  .cat-card .name{font-weight:700;font-size:.95rem;color:var(--green-dark);}
  .cat-card .sub{font-size:.75rem;color:#6a7a68;margin-top:2px;}

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#F2EEE1;
    }
  }
</style>
</head>
<body>

<header>
  <p class="brand">Swalayan Masithah</p>
  <p>Pilih kategori untuk lihat produk dan pesan langsung lewat WhatsApp.</p>
</header>

<main>
  <h2>Kategori Produk</h2>
  <div class="grid">
    <a class="cat-card" href="kategori.html?kategori=sembako">
      <div class="icon">🍚</div>
      <div class="name">Sembako</div>
      <div class="sub">Beras, minyak, gula, dll</div>
    </a>
    <a class="cat-card" href="kategori.html?kategori=minuman">
      <div class="icon">🥤</div>
      <div class="name">Minuman</div>
      <div class="sub">Air, teh, kopi</div>
    </a>
    <a class="cat-card" href="kategori.html?kategori=snack">
      <div class="icon">🍪</div>
      <div class="name">Snack</div>
      <div class="sub">Keripik, biskuit</div>
    </a>
    <a class="cat-card" href="kategori.html?kategori=rumah">
      <div class="icon">🧴</div>
      <div class="name">Kebutuhan Rumah</div>
      <div class="sub">Sabun, deterjen, tisu</div>
    </a>
  </div>
</main>

</body>
</html>
